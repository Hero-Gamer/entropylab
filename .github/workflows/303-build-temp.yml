name: 303 temporary WASM build
on:
  push:
    branches: [feat/303-bip322-verifier]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync with latest branch head
        run: git reset --hard origin/feat/303-bip322-verifier
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:wasm
      - run: git diff --check
      - name: Commit generated PSBT WASM
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Hero-Gamer@users.noreply.github.com
          git add src/js/psbt-wasm-b64.js psbt-wasm/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(#303): regenerate PSBT WASM artifact'
          git push origin HEAD:feat/303-bip322-verifier
