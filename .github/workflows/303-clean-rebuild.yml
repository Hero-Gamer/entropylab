name: 303 clean rebuild worker
on:
  push:
    branches:
      - wip/303-bip322-clean-rebuild
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and validate #303
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/303-bip322-verifier
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          def old(path):
              return subprocess.check_output(["git", "show", f"origin/feat/303-bip322-verifier:{path}"]).decode()
          for path in ["src/js/bip322.js", "test/bip322.test.mjs", "psbt-wasm/src/bip322_verifier.rs"]:
              Path(path).write_text(old(path))
          cargo = Path("psbt-wasm/Cargo.toml")
          text = cargo.read_text()
          if 'bip322 = "=0.0.12"' not in text:
              text = text.replace('bip322 = "=0.0.11"', 'bip322 = "=0.0.12"')
              if 'bip322 = "=0.0.12"' not in text:
                  text = text.replace('bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }', 'base64 = "=0.23.0"\nbitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }\nbip322 = "=0.0.12"')
          if 'base64 = "=0.23.0"' not in text:
              text = text.replace('bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }', 'base64 = "=0.23.0"\nbitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }')
          cargo.write_text(text)
          lib = Path("psbt-wasm/src/lib.rs")
          text = lib.read_text()
          if 'mod bip322_verifier;' not in text:
              marker = 'use bitcoin::bip32::{ChildNumber, DerivationPath, Xpub};'
              text = text.replace(marker, 'mod bip322_verifier;\n\n' + marker, 1)
          lib.write_text(text)
          wasm = Path("src/js/psbt-wasm.js")
          current = wasm.read_text()
          prior = old("src/js/psbt-wasm.js")
          marker = 'export const bip322WasmVerify'
          if marker not in current:
              current += '\n\n' + prior[prior.index(marker):]
              wasm.write_text(current)
          app = Path("src/js/app.js")
          current = app.read_text()
          prior = old("src/js/app.js")
          if 'from "./bip322.js"' not in current:
              current = current.replace('import { initPsbtEditor } from "./psbt-editor.js";', 'import { initPsbtEditor } from "./psbt-editor.js";\nimport { verifyBip322 } from "./bip322.js";', 1)
          if 'function hodlInitBip322()' not in current:
              start = prior.index('function hodlInitBip322()')
              end = prior.index('\nfunction ', start + 1)
              current = current[:current.index('function hodlShowWorkspace')] + prior[start:end] + current[current.index('function hodlShowWorkspace'):]
          old_tabs = 'var hodlWorkspaceTabs = [["calc", "workspace.key", "workspace.keyShort"], ["vanity", "workspace.vanity", "workspace.vanityShort"], ["bip85", "workspace.bip85", "workspace.bip85Short"], ["msig", "workspace.msig", "workspace.msigShort"], ["sp", "workspace.sp", "workspace.spShort"], ["psbt", "workspace.psbt", "workspace.psbtShort"], ["journal", "workspace.journal", "workspace.journalShort"]];'
          new_tabs = old_tabs[:-2] + ', ["bip322", "BIP-322", "BIP322"]' + old_tabs[-2:]
          if '"bip322", "BIP-322", "BIP322"' not in current:
              current = current.replace(old_tabs, new_tabs, 1)
          current = current.replace('  document.getElementById("sp-manager").hidden = id !== "sp";\n', '  document.getElementById("sp-manager").hidden = id !== "sp";\n  document.getElementById("bip322-manager").hidden = id !== "bip322";\n', 1)
          current = current.replace('  document.getElementById("sp-card").hidden = id !== "sp";\n', '  document.getElementById("sp-card").hidden = id !== "sp";\n  document.getElementById("bip322-card").hidden = id !== "bip322";\n', 1)
          current = current.replace('["bip85", "sp", "msig", "calc", "vanity"].forEach((tool) => {', '["bip85", "sp", "msig", "calc", "vanity", "bip322"].forEach((tool) => {', 1)
          current = current.replace('  hodlInitSp();\n}', '  hodlInitSp();\n  hodlInitBip322();\n}', 1)
          app.write_text(current)
          shell = Path("src/shell.html")
          current = shell.read_text()
          prior = old("src/shell.html")
          if 'id="bip322-card"' not in current:
              start = prior.index('    <div class="tool-intro" id="bip322-tool-intro"')
              end = prior.index('    <div class="tool-intro" id="journal-tool-intro"', start)
              current = current.replace('    <div class="tool-intro" id="journal-tool-intro"', prior[start:end] + '    <div class="tool-intro" id="journal-tool-intro"', 1)
          shell.write_text(current)
          css = Path("src/css/styles.css")
          current = css.read_text()
          if '.bip322-state' not in current:
              prior_css = old("src/css/styles.css")
              rules = [m.group(0).strip() for m in re.finditer(r'[^{}]+\{[^{}]*\}', prior_css) if '.bip322' in m.group(0)]
              current += '\n\n/* BIP-322 verifier */\n' + '\n'.join(rules) + '\n'
          css.write_text(current)
          package = Path("package.json")
          text = package.read_text()
          if 'test/bip322.test.mjs' not in text:
              text = text.replace('test/i18n.test.mjs"', 'test/i18n.test.mjs test/bip322.test.mjs"', 1)
          package.write_text(text)
          PY
          cd psbt-wasm
          cargo update
          cargo test
          cd ..
          npm ci
          npm run build:wasm
          npm test -- test/bip322.test.mjs
          npm run build
          npm run verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add psbt-wasm/Cargo.toml psbt-wasm/Cargo.lock psbt-wasm/src/lib.rs psbt-wasm/src/bip322_verifier.rs src/js/psbt-wasm.js src/js/psbt-wasm-b64.js src/js/bip322.js test/bip322.test.mjs src/js/app.js src/shell.html src/css/styles.css package.json
          git diff --cached --check
          git commit -m 'feat(#303): add offline BIP-322 verifier' || true
          git push origin HEAD:wip/303-bip322-clean-rebuild
