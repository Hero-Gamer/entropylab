name: 303 private final builder
on:
  push:
    branches:
      - wip/303-final
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct #303 from the clean upstream base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/303-bip322-verifier
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          def old(path):
              return subprocess.check_output(["git", "show", f"origin/feat/303-bip322-verifier:{path}"]).decode()
          for path in ["src/js/bip322.js", "test/bip322.test.mjs", "psbt-wasm/src/bip322_verifier.rs"]:
              Path(path).write_text(old(path))
          cargo = Path("psbt-wasm/Cargo.toml")
          text = cargo.read_text()
          text = text.replace('bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }', 'base64 = "=0.23.0"\nbitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }\nbip322 = "=0.0.12"', 1)
          cargo.write_text(text)
          lib = Path("psbt-wasm/src/lib.rs")
          text = lib.read_text()
          if 'mod bip322_verifier;' not in text:
              text = text.replace('use bitcoin::bip32::{ChildNumber, DerivationPath, Xpub};', 'mod bip322_verifier;\n\nuse bitcoin::bip32::{ChildNumber, DerivationPath, Xpub};', 1)
          lib.write_text(text)
          wasm = Path("src/js/psbt-wasm.js")
          current = wasm.read_text(); prior = old("src/js/psbt-wasm.js")
          marker = 'export const bip322WasmVerify'
          if marker not in current:
              current += '\n\n' + prior[prior.index(marker):]
              wasm.write_text(current)
          app = Path("src/js/app.js")
          current = app.read_text(); prior = old("src/js/app.js")
          if 'from "./bip322.js"' not in current:
              current = current.replace('import { initPsbtEditor } from "./psbt-editor.js";', 'import { initPsbtEditor } from "./psbt-editor.js";\nimport { verifyBip322 } from "./bip322.js";', 1)
          if 'function hodlInitBip322()' not in current:
              start = prior.index('function hodlInitBip322()'); end = prior.index('\nfunction ', start + 1)
              pos = current.index('function hodlShowWorkspace')
              current = current[:pos] + prior[start:end] + current[pos:]
          old_tabs = 'var hodlWorkspaceTabs = [["calc", "workspace.key", "workspace.keyShort"], ["vanity", "workspace.vanity", "workspace.vanityShort"], ["bip85", "workspace.bip85", "workspace.bip85Short"], ["msig", "workspace.msig", "workspace.msigShort"], ["sp", "workspace.sp", "workspace.spShort"], ["psbt", "workspace.psbt", "workspace.psbtShort"], ["journal", "workspace.journal", "workspace.journalShort"]];'
          new_tabs = old_tabs[:-2] + ', ["bip322", "BIP-322", "BIP322"]' + old_tabs[-2:]
          if '"bip322", "BIP-322", "BIP322"' not in current:
              current = current.replace(old_tabs, new_tabs, 1)
          current = current.replace('  document.getElementById("sp-manager").hidden = id !== "sp";\n', '  document.getElementById("sp-manager").hidden = id !== "sp";\n  document.getElementById("bip322-manager").hidden = id !== "bip322";\n', 1)
          current = current.replace('  document.getElementById("sp-card").hidden = id !== "sp";\n', '  document.getElementById("sp-card").hidden = id !== "sp";\n  document.getElementById("bip322-card").hidden = id !== "bip322";\n', 1)
          current = current.replace('["bip85", "sp", "msig", "calc", "vanity"].forEach((tool) => {', '["bip85", "sp", "msig", "calc", "vanity", "bip322"].forEach((tool) => {', 1)
          current = current.replace('  hodlInitSp();\n}', '  hodlInitSp();\n  hodlInitBip322();\n}', 1)
          app.write_text(current)
          shell = Path("src/shell.html"); current = shell.read_text(); prior = old("src/shell.html")
          if 'id="bip322-card"' not in current:
              start = prior.index('    <div class="tool-intro" id="bip322-tool-intro"'); end = prior.index('    <div class="tool-intro" id="journal-tool-intro"', start)
              current = current.replace('    <div class="tool-intro" id="journal-tool-intro"', prior[start:end] + '    <div class="tool-intro" id="journal-tool-intro"', 1)
          shell.write_text(current)
          css = Path("src/css/styles.css"); current = css.read_text()
          if '.bip322-state' not in current:
              prior_css = old("src/css/styles.css")
              rules = [m.group(0).strip() for m in re.finditer(r'[^{}]+\{[^{}]*\}', prior_css) if '.bip322' in m.group(0)]
              current += '\n\n/* BIP-322 verifier */\n' + '\n'.join(rules) + '\n'
          css.write_text(current)
          package = Path("package.json"); text = package.read_text()
          if 'test/bip322.test.mjs' not in text:
              text = text.replace('test/i18n.test.mjs test/i18n-sanitizer.test.mjs', 'test/i18n.test.mjs test/bip322.test.mjs test/i18n-sanitizer.test.mjs', 1)
          package.write_text(text)
          PY
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(#303): checkpoint reconstruction'
      - name: Rust and JS validation
        shell: bash
        run: |
          set -euo pipefail
          cd psbt-wasm
          cargo update
          cargo test
          cd ..
          npm ci
          npm run build:wasm
          npm test -- test/bip322.test.mjs
          npm run test:ci
          npm run build
          npm run verify
      - name: Browser validation
        shell: bash
        run: |
          set -euo pipefail
          node test/browser-check.mjs
      - name: Squash to one clean feature commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/303-final-builder.yml
          git add -A
          git diff --cached --check
          git reset --soft origin/rock
          git reset
          git add -A
          git diff --cached --check
          git commit -m 'feat(#303): add offline BIP-322 verifier'
          git push --force origin HEAD:wip/303-final
