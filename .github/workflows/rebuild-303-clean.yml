name: Rebuild BIP-322 #303 clean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-303:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork rock
        uses: actions/checkout@v4
        with:
          repository: Hero-Gamer/entropylab
          ref: rock
          fetch-depth: 0

      - name: Start from current upstream rock
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/OogaBoogaX/entropylab.git
          git fetch upstream rock --prune
          git checkout -B feat/303-bip322-clean add7db38efb973b0e6e1e89e8015cf7ef6034e90
          git fetch origin feat/303-bip322-verifier
          git status --short
          git log -1 --oneline

      - name: Extract the three standalone #303 files
        shell: bash
        run: |
          set -euxo pipefail
          git checkout origin/feat/303-bip322-verifier -- \
            psbt-wasm/src/bip322_verifier.rs \
            src/js/bip322.js \
            test/bip322.test.mjs

      - name: Inspect current and old UI integration points
        shell: bash
        run: |
          set -euxo pipefail
          echo '--- current workspace/tab references ---'
          grep -n -E 'hodlWorkspaceTabs|hodlShowWorkspace|hodlInitWorkspace|data-workspace|tool-tabs|Expected.*tabs|Expected.*tools' src/js/app.js src/shell.html test/ui-defaults.test.mjs test/browser-suite.html | head -n 240 || true
          echo '--- old BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/js/app.js | grep -n -E 'hodlInitBip322|bip322-manager|bip322-card|bip322-tool-intro|bip322' | head -n 240 || true
          echo '--- old shell BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/shell.html | grep -n -E 'bip322|BIP-322' | head -n 240 || true
          echo '--- old CSS BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/css/styles.css | grep -n -E 'bip322|bip-322' | head -n 240 || true

      - name: Merge #303 into current UI without replacing current files
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def old(path):
              return subprocess.check_output(['git','show',f'origin/feat/303-bip322-verifier:{path}'], text=True)

          # app.js: extract the BIP-322 initializer from the old branch and insert it
          # into the current file, then make only the required tab/visibility/init edits.
          p = Path('src/js/app.js')
          cur = p.read_text()
          old_app = old('src/js/app.js')
          m = re.search(r'(?ms)^function hodlInitBip322\(\) \{.*?(?=^function |^var |^let |^const |\Z)', old_app)
          if not m:
              raise SystemExit('Could not locate hodlInitBip322 in old app.js')
          fn = m.group(0).rstrip() + '\n'
          if 'function hodlInitBip322()' not in cur:
              marker = 'function hodlShowWorkspace('
              if marker not in cur:
                  raise SystemExit('Could not locate hodlShowWorkspace in current app.js')
              cur = cur.replace(marker, fn + '\n' + marker, 1)
          if 'import { verifyBip322 } from "./bip322.js";' not in cur:
              marker = 'import '
              # Preserve the existing import style and insert after the import block.
              lines = cur.splitlines(True)
              idx = 0
              while idx < len(lines) and (lines[idx].startswith('import ') or not lines[idx].strip()):
                  idx += 1
              lines.insert(idx, 'import { verifyBip322 } from "./bip322.js";\n')
              cur = ''.join(lines)
          if '["bip322", "BIP-322", "BIP322"]' not in cur:
              target = '["journal", "Journal", "JOURNAL"]'
              if target not in cur:
                  # Fall back to the final tab entry in the workspace array.
                  mm = re.search(r'(var hodlWorkspaceTabs = \[.*?)(\];)', cur, re.S)
                  if not mm:
                      raise SystemExit('Could not locate hodlWorkspaceTabs')
                  body = mm.group(1)
                  body = body.rstrip() + ', ["bip322", "BIP-322", "BIP322"]'
                  cur = cur[:mm.start(1)] + body + cur[mm.end(1):]
              else:
                  cur = cur.replace(target, target + ', ["bip322", "BIP-322", "BIP322"]', 1)
          # Add BIP-322 manager/card handling next to the other workspace visibility logic.
          if 'bip322-manager' not in cur:
              marker = 'document.getElementById("key-manager").hidden'
              pos = cur.find(marker)
              if pos == -1:
                  raise SystemExit('Could not locate key-manager visibility block')
              line_end = cur.find('\n', pos)
              line = cur[pos:line_end]
              cur = cur[:line_end+1] + '  document.getElementById("bip322-manager").hidden = !visible;\n' + cur[line_end+1:]
          if 'bip322-card' not in cur:
              marker = 'document.getElementById("calc-card").hidden'
              pos = cur.find(marker)
              if pos == -1:
                  raise SystemExit('Could not locate calc-card visibility block')
              line_end = cur.find('\n', pos)
              cur = cur[:line_end+1] + '  document.getElementById("bip322-card").hidden = !visible;\n' + cur[line_end+1:]
          if '"bip322", "sp", "msig", "calc", "vanity"' not in cur and '"bip322"' not in cur[cur.find('function hodlShowWorkspace'):cur.find('function hodlShowWorkspace')+5000]:
              cur = cur.replace('["bip85", "sp", "msig", "calc", "vanity"]', '["bip322", "bip85", "sp", "msig", "calc", "vanity"]', 1)
          if 'hodlInitBip322();' not in cur:
              marker = '  hodlInitSp();'
              if marker not in cur:
                  raise SystemExit('Could not locate hodlInitSp in workspace init')
              cur = cur.replace(marker, marker + '\n  hodlInitBip322();', 1)
          p.write_text(cur)

          # shell.html: copy only the old BIP-322 intro/manager/card block. The current
          # workspace tabs are generated dynamically by app.js, so no static tab markup is copied.
          p = Path('src/shell.html')
          cur = p.read_text()
          old_shell = old('src/shell.html')
          if 'id="bip322-tool-intro"' not in cur:
              start = old_shell.find('<section id="bip322-tool-intro"')
              if start == -1:
                  start = old_shell.find('<div id="bip322-tool-intro"')
              if start == -1:
                  raise SystemExit('Could not locate BIP-322 intro block in old shell.html')
              # Include through the next top-level tool intro/card boundary.
              end = old_shell.find('<section id="journal-tool-intro"', start)
              if end == -1:
                  end = old_shell.find('<section id="journal-card"', start)
              if end == -1:
                  raise SystemExit('Could not locate insertion boundary in old shell.html')
              block = old_shell[start:end]
              marker = '<section id="journal-tool-intro"'
              if marker not in cur:
                  marker = '<section id="journal-card"'
              if marker not in cur:
                  raise SystemExit('Could not locate current shell insertion point')
              cur = cur.replace(marker, block + '\n' + marker, 1)
          p.write_text(cur)

          # CSS: append only selectors containing bip322/bip-322 from the old branch.
          # If no old CSS rules exist, fail rather than inventing styling.
          p = Path('src/css/styles.css')
          cur = p.read_text()
          if 'bip322' not in cur.lower():
              old_css = old('src/css/styles.css')
              rules = re.findall(r'(?ms)([^{}]*?(?:bip322|bip-322)[^{}]*\{[^{}]*\})', old_css, re.I)
              if not rules:
                  raise SystemExit('Could not locate BIP-322 CSS rules in old styles.css')
              p.write_text(cur.rstrip() + '\n\n/* BIP-322 verifier */\n' + '\n'.join(rules) + '\n')

          # package.json: add the focused test to test:ci only if not already present.
          p = Path('package.json')
          cur = p.read_text()
          if 'test/bip322.test.mjs' not in cur:
              cur = cur.replace('"test:ci": "', '"test:ci": "node --test test/bip322.test.mjs && ', 1)
              p.write_text(cur)
          PY

      - name: Configure Rust and Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Setup Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build WASM
        shell: bash
        run: npm run build:wasm

      - name: Build application
        shell: bash
        run: npm run build

      - name: Run focused BIP-322 tests
        shell: bash
        run: npm test -- test/bip322.test.mjs

      - name: Run full test suite
        shell: bash
        run: npm test 2>&1 | tee npm-test.log

      - name: Run verification
        shell: bash
        run: npm run verify 2>&1 | tee npm-verify.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-303-failure-logs
          path: |
            npm-test.log
            npm-verify.log
            package.json
            src/js/app.js
            src/shell.html
            src/css/styles.css
            test/bip322.test.mjs
          if-no-files-found: ignore

      - name: Review diff before commit
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git status --short
          git diff --stat add7db38efb973b0e6e1e89e8015cf7ef6034e90..HEAD -- . ':!entropylab.html'

      - name: Commit clean feature
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/rebuild-303-clean.yml
          git config user.name "bip322-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(bip322): add offline generic signed message verifier (#303)"
          git push origin feat/303-bip322-clean --force
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "DIFF_STAT" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat add7db38efb973b0e6e1e89e8015cf7ef6034e90^..HEAD >> "$GITHUB_STEP_SUMMARY"
