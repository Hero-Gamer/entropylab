name: Rebuild BIP-322 #303 clean

on:
  push:
    branches:
      - wip/303-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-303:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork rock
        uses: actions/checkout@v4
        with:
          repository: Hero-Gamer/entropylab
          ref: rock
          fetch-depth: 0

      - name: Start from current upstream rock
        shell: bash
        run: |
          set -euxo pipefail
          git remote add upstream https://github.com/OogaBoogaX/entropylab.git
          git fetch upstream rock --prune
          test "$(git rev-parse upstream/rock)" = "add7db38efb973b0e6e1e89e8015cf7ef6034e90"
          git checkout -B feat/303-bip322-clean add7db38efb973b0e6e1e89e8015cf7ef6034e90
          git fetch origin feat/303-bip322-verifier
          git status --short
          git log -1 --oneline

      - name: Extract the three standalone #303 files
        shell: bash
        run: |
          set -euxo pipefail
          git checkout origin/feat/303-bip322-verifier -- \
            psbt-wasm/src/bip322_verifier.rs \
            src/js/bip322.js \
            test/bip322.test.mjs

      - name: Inspect integration points
        shell: bash
        run: |
          set -euxo pipefail
          echo '--- current workspace integration ---'
          grep -n -E 'hodlWorkspaceTabs|hodlShowWorkspace|hodlInitWorkspace|data-workspace|tool-tabs|Expected.*tabs|Expected.*tools' src/js/app.js src/shell.html test/ui-defaults.test.mjs test/browser-suite.html | head -n 300 || true
          echo '--- old BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/js/app.js | grep -n -E 'hodlInitBip322|bip322-manager|bip322-card|bip322-tool-intro|bip322' | head -n 300 || true
          echo '--- old shell BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/shell.html | grep -n -E 'bip322|BIP-322' | head -n 300 || true
          echo '--- old CSS BIP-322 symbols ---'
          git show origin/feat/303-bip322-verifier:src/css/styles.css | grep -n -E 'bip322|bip-322' | head -n 300 || true

      - name: Merge #303 into current UI without replacing current files
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def old(path):
              return subprocess.check_output(['git','show',f'origin/feat/303-bip322-verifier:{path}'], text=True)

          # app.js
          p = Path('src/js/app.js')
          cur = p.read_text()
          old_app = old('src/js/app.js')
          m = re.search(r'(?ms)^function hodlInitBip322\(\) \{.*?(?=^function |^var |^let |^const |\Z)', old_app)
          if not m:
              raise SystemExit('Could not locate hodlInitBip322 in old app.js')
          fn = m.group(0).rstrip() + '\n'
          if 'function hodlInitBip322()' not in cur:
              marker = 'function hodlShowWorkspace('
              if marker not in cur:
                  raise SystemExit('Could not locate hodlShowWorkspace in current app.js')
              cur = cur.replace(marker, fn + '\n' + marker, 1)
          if 'import { verifyBip322 } from "./bip322.js";' not in cur:
              lines = cur.splitlines(True)
              idx = 0
              while idx < len(lines) and (lines[idx].startswith('import ') or not lines[idx].strip()):
                  idx += 1
              lines.insert(idx, 'import { verifyBip322 } from "./bip322.js";\n')
              cur = ''.join(lines)
          if '["bip322", "BIP-322", "BIP322"]' not in cur:
              mm = re.search(r'(var hodlWorkspaceTabs = \[.*?\]);', cur, re.S)
              if not mm:
                  raise SystemExit('Could not locate hodlWorkspaceTabs')
              array = mm.group(1)
              insert_at = array.rfind(']')
              array = array[:insert_at] + ', ["bip322", "BIP-322", "BIP322"]' + array[insert_at:]
              cur = cur[:mm.start(1)] + array + cur[mm.end(1):]
          if 'bip322-manager' not in cur:
              marker = 'document.getElementById("key-manager").hidden'
              pos = cur.find(marker)
              if pos == -1:
                  raise SystemExit('Could not locate key-manager visibility block')
              line_end = cur.find('\n', pos)
              cur = cur[:line_end+1] + '  document.getElementById("bip322-manager").hidden = !visible;\n' + cur[line_end+1:]
          if 'bip322-card' not in cur:
              marker = 'document.getElementById("calc-card").hidden'
              pos = cur.find(marker)
              if pos == -1:
                  raise SystemExit('Could not locate calc-card visibility block')
              line_end = cur.find('\n', pos)
              cur = cur[:line_end+1] + '  document.getElementById("bip322-card").hidden = !visible;\n' + cur[line_end+1:]
          if 'hodlInitBip322();' not in cur:
              marker = '  hodlInitSp();'
              if marker not in cur:
                  raise SystemExit('Could not locate hodlInitSp in workspace init')
              cur = cur.replace(marker, marker + '\n  hodlInitBip322();', 1)
          # Ensure intro visibility includes BIP-322 by locating the actual list in the current function.
          if '"bip322"' not in cur[cur.find('function hodlShowWorkspace'):cur.find('function hodlShowWorkspace')+7000]:
              old_list = '["bip85", "sp", "msig", "calc", "vanity"]'
              if old_list in cur:
                  cur = cur.replace(old_list, '["bip322", "bip85", "sp", "msig", "calc", "vanity"]', 1)
          p.write_text(cur)

          # shell.html
          p = Path('src/shell.html')
          cur = p.read_text()
          old_shell = old('src/shell.html')
          if 'bip322-tool-intro' not in cur:
              starts = ['<section id="bip322-tool-intro"', '<div id="bip322-tool-intro"']
              start = next((old_shell.find(x) for x in starts if old_shell.find(x) != -1), -1)
              if start == -1:
                  raise SystemExit('Could not locate BIP-322 intro block in old shell.html')
              boundaries = ['<section id="journal-tool-intro"', '<section id="journal-card"']
              ends = [old_shell.find(x, start) for x in boundaries if old_shell.find(x, start) != -1]
              if not ends:
                  raise SystemExit('Could not locate shell insertion boundary')
              block = old_shell[start:min(ends)]
              marker = '<section id="journal-tool-intro"'
              if marker not in cur:
                  marker = '<section id="journal-card"'
              if marker not in cur:
                  raise SystemExit('Could not locate current shell insertion point')
              cur = cur.replace(marker, block + '\n' + marker, 1)
          p.write_text(cur)

          # styles.css
          p = Path('src/css/styles.css')
          cur = p.read_text()
          if 'bip322' not in cur.lower():
              old_css = old('src/css/styles.css')
              # Extract complete simple CSS rules whose selector contains BIP-322.
              rules = re.findall(r'(?ms)([^{}]*?(?:bip322|bip-322)[^{}]*\{[^{}]*\})', old_css, re.I)
              if not rules:
                  raise SystemExit('Could not locate BIP-322 CSS rules in old styles.css')
              p.write_text(cur.rstrip() + '\n\n/* BIP-322 verifier */\n' + '\n'.join(rules) + '\n')

          # package.json
          p = Path('package.json')
          cur = p.read_text()
          if 'test/bip322.test.mjs' not in cur:
              marker = '"test:ci": "'
              if marker not in cur:
                  raise SystemExit('Could not locate test:ci script')
              cur = cur.replace(marker, marker + 'node --test test/bip322.test.mjs && ', 1)
              p.write_text(cur)
          PY

      - name: Pin bip322 0.0.12 and wire WASM
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          old_lib = subprocess.check_output(['git','show','origin/feat/303-bip322-verifier:psbt-wasm/src/lib.rs'], text=True)
          old_wrap = subprocess.check_output(['git','show','origin/feat/303-bip322-verifier:src/js/psbt-wasm.js'], text=True)
          p = Path('psbt-wasm/Cargo.toml')
          cur = p.read_text()
          if 'bip322 = ' not in cur:
              # Insert beside the existing Bitcoin dependencies.
              marker = 'bitcoin = '
              pos = cur.find(marker)
              if pos == -1:
                  raise SystemExit('Could not locate bitcoin dependency in Cargo.toml')
              end = cur.find('\n', pos)
              cur = cur[:end+1] + 'bip322 = "=0.0.12"\n' + cur[end+1:]
              p.write_text(cur)

          p = Path('psbt-wasm/src/lib.rs')
          cur = p.read_text()
          if 'mod bip322_verifier;' not in cur:
              cur = 'mod bip322_verifier;\n' + cur
          # Copy only the old wasm export function(s) whose names are BIP-322 related.
          for name in re.findall(r'(?m)^pub fn ([A-Za-z0-9_]*bip322[A-Za-z0-9_]*)', old_lib):
              if name not in cur:
                  m = re.search(rf'(?ms)^pub fn {re.escape(name)}\b.*?(?=^pub fn |\Z)', old_lib)
                  if m:
                      cur += '\n' + m.group(0).rstrip() + '\n'
          p.write_text(cur)

          p = Path('src/js/psbt-wasm.js')
          cur = p.read_text()
          if 'bip322WasmVerify' not in cur:
              m = re.search(r'(?ms)(?:^|\n)(?:export )?(?:const|function) bip322WasmVerify\b.*?(?=\n(?:export )?(?:const|function) |\Z)', old_wrap)
              if not m:
                  raise SystemExit('Could not locate bip322WasmVerify wrapper in old psbt-wasm.js')
              block = m.group(0).lstrip('\n')
              cur = cur.rstrip() + '\n\n' + block.rstrip() + '\n'
              p.write_text(cur)
          PY

      - name: Setup Node and Rust
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Setup Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f psbt-wasm/rust-toolchain.toml ]; then
            rustup toolchain install "$(awk -F'"' '/channel[[:space:]]*=/{print $2; exit}' psbt-wasm/rust-toolchain.toml)"
            rustup default "$(awk -F'"' '/channel[[:space:]]*=/{print $2; exit}' psbt-wasm/rust-toolchain.toml)"
          fi
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build WASM
        shell: bash
        run: npm run build:wasm

      - name: Build application
        shell: bash
        run: npm run build

      - name: Run focused BIP-322 tests
        shell: bash
        run: npm test -- test/bip322.test.mjs

      - name: Run full test suite
        shell: bash
        run: npm test 2>&1 | tee npm-test.log

      - name: Run verification
        shell: bash
        run: npm run verify 2>&1 | tee npm-verify.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-303-failure-logs
          path: |
            npm-test.log
            npm-verify.log
            package.json
            psbt-wasm/Cargo.toml
            psbt-wasm/src/lib.rs
            src/js/app.js
            src/js/psbt-wasm.js
            src/shell.html
            src/css/styles.css
            test/bip322.test.mjs
          if-no-files-found: ignore

      - name: Commit clean feature
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/rebuild-303-clean.yml
          git config user.name "bip322-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(bip322): add offline generic signed message verifier (#303)"
          git push origin feat/303-bip322-clean --force
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat add7db38efb973b0e6e1e89e8015cf7ef6034e90^..HEAD >> "$GITHUB_STEP_SUMMARY"
